openapi: 3.0.0
info:
  title: CollabCode API
  version: 1.0.0
  description: API for CollabCode - A real-time collaborative coding platform.
servers:
  - url: http://localhost:3000/api
    description: Local development server
paths:
  /rooms:
    post:
      summary: Create a new room
      operationId: createRoom
      tags:
        - Rooms
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
  /rooms/{roomId}:
    get:
      summary: Get room details
      operationId: getRoom
      tags:
        - Rooms
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          description: Room not found
  /rooms/{roomId}/join:
    post:
      summary: Join a room
      operationId: joinRoom
      tags:
        - Rooms
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined room successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
  /rooms/{roomId}/leave:
    post:
      summary: Leave a room
      operationId: leaveRoom
      tags:
        - Rooms
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Left room successfully
  /rooms/{roomId}/code:
    put:
      summary: Update room code
      operationId: updateRoomCode
      tags:
        - Rooms
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
                - code
      responses:
        '200':
          description: Code updated
  /rooms/{roomId}/language:
    put:
      summary: Update room language
      operationId: updateRoomLanguage
      tags:
        - Rooms
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
              required:
                - language
      responses:
        '200':
          description: Language updated
  /rooms/{roomId}/users/count:
    get:
      summary: Get connected users count
      operationId: getConnectedUsers
      tags:
        - Rooms
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connected users count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
  /execute:
    post:
      summary: Execute code
      operationId: executeCode
      tags:
        - Execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                language:
                  type: string
              required:
                - code
                - language
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeExecutionResult'

components:
  schemas:
    Room:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        language:
          type: string
        createdAt:
          type: string
          format: date-time
        connectedUsers:
          type: integer
      required:
        - id
        - code
        - language
        - createdAt
        - connectedUsers
    CodeExecutionResult:
      type: object
      properties:
        output:
          type: string
        error:
          type: string
      required:
        - output
